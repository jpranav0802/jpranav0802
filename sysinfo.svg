.header { font-family: 'Courier New', monospace; font-size: 13px; fill: #7d8590; }
</style></defs>
<rect width="100%" height="100%" fill="#0d1117" rx="6"/>
<rect x="0" y="0" width="100%" height="40" fill="#161b22" rx="6"/>
<circle cx="18" cy="20" r="5" fill="#ff5f56"/>
<circle cx="34" cy="20" r="5" fill="#ffbd2e"/>
<circle cx="50" cy="20" r="5" fill="#27c93f"/>
