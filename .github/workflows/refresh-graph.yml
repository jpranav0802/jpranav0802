name: Refresh contribution graph

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tools/requirements-daily.txt
      - run: python tools/pull_contributions.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
      - run: python tools/render_graph.py
      - run: python tools/pull_stats.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python tools/pull_languages.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python tools/pull_loc.py
        env:
          GH_USERNAME: ${{ github.repository_owner }}
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
      - run: python tools/render_panel.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "auto: refresh contribution graph and stats [skip ci]"
          file_pattern: "assets/*.json graph.svg sysinfo.svg"
